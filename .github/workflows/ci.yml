name: Django CI/CD

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: ${{ secrets.NAME }}
          POSTGRES_USER: ${{ secrets.USER }}
          POSTGRES_PASSWORD: ${{ secrets.PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHON_VERSION: 3.13
      NAME: ${{ secrets.NAME }}
      USER: ${{ secrets.USER }}
      PASSWORD: ${{ secrets.PASSWORD }}
      HOST: ${{ secrets.HOST }}
      PORT: ${{ secrets.PORT }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: ${{ secrets.DEBUG }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h $HOST -p $PORT; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Make migrations
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NAME: ${{ secrets.NAME }}
          USER: ${{ secrets.USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
        run: |
          python manage.py makemigrations --noinput
          python manage.py migrate --noinput

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to remote server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          set -e
          DEPLOY_DIR="${{ secrets.DEPLOY_DIR }}"
          echo "Adding safe.directory..."
          git config --global --add safe.directory "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"
          # Проверка и клонирование
          if [ ! -d ".git" ]; then
            git clone https://github.com/DashulyaE/restaurant_table_reservation.git .
          fi
          
          git pull origin feature
          
          # Создаем файл .env
          cat > .env << EOL
          DEBUG=${{ secrets.DEBUG }}
          DEPLOY_DIR=${{ secrets.DEPLOY_DIR }}
          EMAIL_HOST="${{ secrets.EMAIL_HOST }}"
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          HOST=${{ secrets.HOST }}
          NAME=${{ secrets.NAME }}
          PASSWORD=${{ secrets.PASSWORD }}
          PORT=${{ secrets.PORT }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          USER=${{ secrets.USER }}
          EOL
          
          # Устанавливаем права
          sudo chmod 600 .env
          sudo chmod -R u+rwX ${{ secrets.DEPLOY_DIR }}
          
          # Настраиваем git
          git config --global --add safe.directory ${{ secrets.DEPLOY_DIR }}
          
          # Обновляем проект
          git pull
          
          # Запускаем контейнеры на сервере
          docker compose --env-file .env up -d
          EOF
