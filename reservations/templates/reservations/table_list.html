{% extends 'reservations/base.html' %}
{% block content %}
<h2>Список столов</h2>
<div class="list-group">
  {% for table in object_list %}
    <div class="list-group-item d-flex justify-content-between align-items-center" style="border: 2px solid #000; padding: 10px; margin-bottom: 10px;">
      <div class="d-flex align-items-center gap-3">
        <h5 class="mb-0">Стол {{ table.number }}</h5>
        <p class="mb-0">Ресторан: {{ table.restaurant.name }}</p>
        <p class="mb-0">Мест: {{ table.size }}</p>
      </div>
      <div class="btn-group" role="group" aria-label="Действия">
        <a href="{% url 'reservations:table_update' table.pk %}" class="btn btn-sm btn-outline-primary">Редактировать</a>
        <a href="{% url 'reservations:table_delete' table.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
