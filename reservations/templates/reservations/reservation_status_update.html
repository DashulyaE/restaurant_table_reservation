{% extends 'reservations/base.html' %}
{% block content %}
<h2>Редактировать статус бронирование</h2>
<form method="post" class="mb-3">
    {% csrf_token %}
    <div class="mb-3">
        {{ form.status }}
    </div>
    <button type="submit" class="btn btn-primary">Обновить</button>
</form>
{% endblock %}
