{% extends 'reservations/base.html' %}
{% block content %}
<div class="d-flex justify-content-center w-100">
  <div class="row row-cols-1 row-cols-md-2 mb-3 text-center w-100">
    <div class="col d-flex align-items-stretch mx-auto">
      <div class="card mb-4 rounded-3 shadow-sm w-100 d-flex flex-column">
        <div class="card-header py-3">
          <h4 class="my-0 fw-normal fs-3">Стол {{ object.number }}</h4>
        </div>
        {% if object.restaurant.seating_plan_image %}
          <img src="{{ object.restaurant.seating_plan_image.url }}" class="card-img-top" alt="{{ object.restaurant.name }}">
        {% endif %}
        <div class="card-body d-flex flex-column">
          <h1 class="card-title pricing-card-title">
            <small class="text-body-secondary fw-light fs-5">Ресторан: {{ object.restaurant.name }}</small>
          </h1>
          <p class="mb-2"><strong>Номер стола:</strong> {{ object.number }}</p>
          <p class="mb-2"><strong>Мест:</strong> {{ object.size }}</p>

          <!-- Можно добавить описание или дополнительные детали, если есть -->

          <div class="d-flex gap-2 mt-3">
            <a href="{% url 'reservations:table_list' %}" class="flex-fill btn btn-lg btn-outline-primary text-nowrap fs-6">Назад</a>
            <a href="{% url 'reservations:table_update' object.pk %}" class="flex-fill btn btn-lg btn-outline-primary text-nowrap fs-6">Редактировать</a>
            <a href="{% url 'reservations:table_delete' object.pk %}" class="flex-fill btn btn-lg btn-outline-danger text-nowrap fs-6">Удалить</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
