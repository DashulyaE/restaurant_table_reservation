version: '3.8'

services:
  web:
    build: .
    container_name: my_django_container
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
    command: ["poetry", "run", "python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - app_network

  nginx:
    build: ./nginx
    container_name: nginx_proxy
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - app_network

  db:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge